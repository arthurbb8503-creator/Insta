<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fila Virtual • Sorvete na Chapa</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#10213a} .app{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dce4f1;border-radius:12px;padding:12px} .hidden{display:none}
.header{display:flex;justify-content:space-between;align-items:center;background:#2a50ff;color:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)} .left{grid-column:span 5}.right{grid-column:span 7}.top{grid-column:span 12}
.flavors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:380px;overflow:auto}
.flavor{display:flex;gap:8px;align-items:center;border:1px solid #dce4f1;border-radius:10px;padding:8px;cursor:pointer}.flavor.sel{background:#eef2ff;border-color:#2a50ff}
.flavor img{width:50px;height:50px;object-fit:cover;border-radius:8px}.tickets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ticket{padding:10px 0;text-align:center;border:1px solid #dce4f1;border-radius:8px;cursor:pointer;font-weight:700}.ticket.sel{background:#eef2ff;border-color:#2a50ff}.ticket.busy{background:#fff1f1;color:#b42318;cursor:not-allowed}
.queue-item{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid #dce4f1;border-radius:8px;padding:8px;margin-bottom:8px}
.pill{font-size:12px;padding:4px 7px;border-radius:20px}.waiting{background:#fff4cc}.preparing{background:#e7efff}.done{background:#e7f7ec}
.launch{text-align:center;margin-bottom:12px}.note{font-size:13px;color:#41506b}
@media(max-width:860px){.left,.right,.top{grid-column:span 12}.flavors{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <section id="launch" class="card launch">
    <h2>Escolha o acesso</h2>
    <button id="goAtt">Atendente</button>
    <button id="goCli">Cliente</button>
    <p class="note">Versão: 2026.04.26-v4</p>
  </section>

  <section class="header">
    <strong>Sorvete na Chapa • Fila Virtual</strong>
    <div>
      <button id="navAtt">Atendente</button>
      <button id="navCli">Cliente</button>
    </div>
  </section>

  <section id="att" class="grid hidden">
    <div class="card left">
      <h3>1) Selecione o sabor</h3>
      <div id="flavors" class="flavors"></div>
    </div>
    <div class="card right">
      <h3>2) Selecione a ficha (1-10)</h3>
      <div id="tickets" class="tickets"></div>
      <p><button id="add">Adicionar na fila</button> <button id="clear">Limpar entregues</button></p>
      <h3>Fila atual</h3>
      <div id="queue"></div>
    </div>
  </section>

  <section id="cli" class="grid hidden">
    <div class="card top">
      <h3>Links para QR das fichas</h3>
      <div id="qrs"></div>
    </div>
    <div class="card left">
      <h3>Sua ficha</h3>
      <select id="myTicket"></select>
      <h1 id="num">--</h1>
      <p id="alert">Aguardando seleção da ficha.</p>
    </div>
    <div class="card right">
      <h3>Fila em tempo real</h3>
      <div id="clientQueue"></div>
    </div>
  </section>
</main>

<script>
const KEY='filaSorveteV4', CH='filaSorveteCanalV4';
const flavors=[
['f1','Morango Cremoso','https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=200&q=60'],
['f2','Chocolate Belga','https://images.unsplash.com/photo-1561845730-208ad5910553?auto=format&fit=crop&w=200&q=60'],
['f3','Doce de Leite','https://images.unsplash.com/photo-1514849302-984523450cf4?auto=format&fit=crop&w=200&q=60'],
['f4','Banana Canela','https://images.unsplash.com/photo-1478145046317-39f10e56b5e9?auto=format&fit=crop&w=200&q=60'],
['f5','Maracujá','https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=200&q=60'],
['f6','Oreo','https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=200&q=60'],
['f7','Ninho Nutella','https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=200&q=60'],
['f8','Pistache','https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=200&q=60'],
['f9','Coco Queimado','https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=200&q=60'],
['f10','Limão Siciliano','https://images.unsplash.com/photo-1505253758473-96b7015fcd40?auto=format&fit=crop&w=200&q=60']
];
let st=load(), selFlavor=null, selTicket=null, prev='';
const bc=('BroadcastChannel' in window)?new BroadcastChannel(CH):null;
if(bc) bc.onmessage=e=>{if(e.data?.t==='s'){st=e.data.v;render()}};
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){st=JSON.parse(e.newValue);render()}});
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{q:[],u:Date.now()}}catch{return {q:[],u:Date.now()}}}
function save(){st.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch{};if(bc)bc.postMessage({t:'s',v:st});render();}
function recompute(){const a=st.q.filter(i=>i.s!=='done');a.forEach((i,n)=>i.s=n===0?'preparing':'waiting')}
function busy(n){return st.q.some(i=>i.t===n&&i.s!=='done')}
function add(){if(!selFlavor||!selTicket)return alert('Selecione sabor e ficha');if(busy(selTicket))return alert('Ficha ocupada');st.q.push({id:'p'+Date.now()+Math.random(),f:selFlavor,t:selTicket,s:'waiting',c:Date.now()});recompute();save();}
function delivered(id){const it=st.q.find(x=>x.id===id);if(!it)return;it.s='done';recompute();save();}
function clearDone(){st.q=st.q.filter(i=>i.s!=='done');recompute();save();}
function flavorName(id){const f=flavors.find(x=>x[0]===id);return f?f[1]:'-';}
function item(i){const lab=i.s==='preparing'?'Em preparo':i.s==='waiting'?'Na fila':'Entregue';return `<div class='queue-item'><div><strong>Ficha #${i.t}</strong> • ${flavorName(i.f)}</div><div><span class='pill ${i.s}'>${lab}</span> ${i.s!=='done'?`<button onclick="delivered('${i.id}')">Entregue</button>`:''}</div></div>`}
window.delivered=delivered;
function renderFlavors(){const el=document.getElementById('flavors');el.innerHTML=flavors.map(f=>`<div class='flavor ${selFlavor===f[0]?'sel':''}' data-f='${f[0]}'><img src='${f[2]}' alt='${f[1]}'/><strong>${f[1]}</strong></div>`).join('');el.querySelectorAll('[data-f]').forEach(n=>n.onclick=()=>{selFlavor=n.dataset.f;renderFlavors();});}
function renderTickets(){const el=document.getElementById('tickets');el.innerHTML=Array.from({length:10},(_,i)=>i+1).map(n=>`<div class='ticket ${selTicket===n?'sel':''} ${busy(n)?'busy':''}' data-t='${n}'>#${n}</div>`).join('');el.querySelectorAll('[data-t]').forEach(n=>n.onclick=()=>{if(n.classList.contains('busy'))return;selTicket=Number(n.dataset.t);renderTickets();});}
function renderQueue(){document.getElementById('queue').innerHTML=st.q.length?st.q.map(item).join(''):'<p class="note">Fila vazia.</p>';}
function renderClient(){const active=st.q.filter(i=>i.s!=='done');document.getElementById('clientQueue').innerHTML=active.length?active.map(item).join(''):'<p class="note">Sem pedidos.</p>';const ticket=Number(document.getElementById('myTicket').value||0);document.getElementById('num').textContent=ticket?`#${ticket}`:'--';if(!ticket){document.getElementById('alert').textContent='Aguardando seleção da ficha.';return;}const mine=active.find(i=>i.t===ticket);if(!mine){prev='';document.getElementById('alert').textContent='Ficha livre ou já entregue.';return;}const pos=active.findIndex(i=>i.id===mine.id)+1;const msg=mine.s==='preparing'?'Seu sorvete está em preparação agora!':`Você está na posição ${pos}.`;document.getElementById('alert').textContent=msg;if(msg!==prev&&'Notification' in window&&Notification.permission==='granted')new Notification('Fila do Sorvete',{body:msg});prev=msg;}
function renderQR(){const b=`${location.origin}${location.pathname}`;document.getElementById('qrs').innerHTML=Array.from({length:10},(_,i)=>i+1).map(n=>`<div class='note'>Ficha ${n}: ${b}?modo=cliente&ficha=${n}</div>`).join('');}
function openMode(m){document.getElementById('launch').classList.add('hidden');document.getElementById('att').classList.toggle('hidden',m!=='atendente');document.getElementById('cli').classList.toggle('hidden',m!=='cliente');const p=new URLSearchParams(location.search);p.set('modo',m);history.replaceState(null,'',`${location.pathname}?${p.toString()}`);render();}
function render(){renderFlavors();renderTickets();renderQueue();renderClient();}
document.getElementById('add').onclick=add;document.getElementById('clear').onclick=clearDone;document.getElementById('goAtt').onclick=()=>openMode('atendente');document.getElementById('goCli').onclick=()=>openMode('cliente');document.getElementById('navAtt').onclick=()=>openMode('atendente');document.getElementById('navCli').onclick=()=>openMode('cliente');
const sel=document.getElementById('myTicket');sel.innerHTML='<option value="">Selecione</option>'+Array.from({length:10},(_,i)=>`<option value='${i+1}'>${i+1}</option>`).join('');sel.onchange=renderClient;renderQR();
const params=new URLSearchParams(location.search);const f=params.get('ficha');if(f&&Number(f)>=1&&Number(f)<=10)sel.value=f;const m=params.get('modo');if(m==='atendente'||m==='cliente')openMode(m);
setInterval(()=>{const n=load();if(n.u!==st.u){st=n;render();}},1200);
</script>
</body>
</html>
